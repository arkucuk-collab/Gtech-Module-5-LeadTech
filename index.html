<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Own the Disruption Board</title>
<style>
/* Layout: one sticky navy bar of numbered stations; one station on screen at a time; one scribe per group types.
   Single light look on purpose: the board is screen-shared in breakout rooms, and the programme's materials are white-ground. */
:root{
  --bg:#FFFFFF; --ink:#1B2433; --muted:#5B6472; --line:#D5DCE8; --wash:#F2F4F7;
  --navy:#003087; --navy-tint:#EEF3FB; --sky:#4EAEEE;
  --teal:#00857C; --teal-ink:#00635C; --teal-tint:#E6F4F2;
  --green:#2E9E55; --green-ink:#1F7A3F; --green-tint:#EAF6EE;
  --orange:#E87722; --orange-ink:#B4530B; --orange-tint:#FDF1E6;
  --red:#C0392B; --red-ink:#A32A2A; --red-tint:#FBECEA;
  --note:#FFF4C2; --note-line:#D9BC3C; --note-ink:#6B5E1E;
  --font:Arial, Helvetica, sans-serif;
  --t-xs:12.5px; --t-s:14px; --t-m:15.5px; --t-l:19px; --t-xl:28px;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:var(--t-m);line-height:1.45}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
h1,h2,h3,p,ul{margin:0}

/* a lens sets the colour of a box, its notes and its labels; colour never stands alone, every box is labelled */
.lens-navy{--c:var(--navy);--ci:var(--navy);--t:var(--navy-tint);--n:#E1EAFB;--nl:#9DB6E8}
.lens-teal{--c:var(--teal);--ci:var(--teal-ink);--t:var(--teal-tint);--n:#DDF1EE;--nl:#8CCBC3}
.lens-green{--c:var(--green);--ci:var(--green-ink);--t:var(--green-tint);--n:#DFF2E5;--nl:#96CFA8}
.lens-orange{--c:var(--orange);--ci:var(--orange-ink);--t:var(--orange-tint);--n:#FFE9D4;--nl:#EDB07C}
.lens-red{--c:var(--red);--ci:var(--red-ink);--t:var(--red-tint);--n:#FBE3E0;--nl:#E3B5AF}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy)}
.bar-in{max-width:1280px;margin-inline:auto;padding:10px 20px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.logo{height:34px;width:auto;display:block;flex:none}
.brand{display:flex;flex-direction:column;line-height:1.2}
.brand b{color:#FFFFFF;font-size:17px}
.brand span{color:#BFD0EE;font-size:var(--t-xs)}
.tabs{display:flex;flex-wrap:wrap;gap:5px;flex:1;min-width:0}
.tab{border:1px solid #6F8FCB;background:transparent;color:#FFFFFF;padding:6px 10px;border-radius:999px;font-size:13.5px;cursor:pointer;display:flex;gap:7px;align-items:center;white-space:nowrap;flex:none}
.tab b{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:#FFFFFF;color:var(--ci)}
.tab[aria-current="page"]{background:#FFFFFF;border-color:#FFFFFF;color:var(--navy)}
.tab[aria-current="page"] b{background:var(--ci);color:#FFFFFF}
.who{display:flex;align-items:center;gap:8px;font-size:var(--t-s);color:#DCE6F7}
.who select{font-size:var(--t-s);font-weight:700;color:var(--navy);border:1.5px solid #FFFFFF;border-radius:6px;padding:6px 8px;background:#FFFFFF}
@media (max-width:900px){.tabs{order:3;flex-basis:100%;flex-wrap:nowrap;overflow-x:auto;padding-bottom:3px}.who{margin-left:auto}.logo{height:26px}}
@media (max-width:560px){.logo-r,.brand span{display:none}}
.foot{background:var(--navy);color:#BFD0EE;font-size:var(--t-s)}
.foot-in{max-width:1280px;margin-inline:auto;padding:16px 20px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.foot .logo{height:30px}

.wrap{max-width:1280px;margin-inline:auto;padding-inline:20px;padding-block:22px 64px;display:flex;flex-direction:column;gap:22px}
.hero{background:var(--navy);padding:28px 28px 0;display:flex;flex-direction:column;gap:10px}
.hero h1{color:#FFFFFF;font-size:34px;line-height:1.1;text-wrap:balance}
.hero p{color:#DCE6F7;font-size:var(--t-l);max-width:62ch}
.stripe{display:grid;grid-template-columns:repeat(4,1fr);height:8px;margin:18px -28px 0}
.stripe i:nth-child(1){background:var(--sky)}.stripe i:nth-child(2){background:var(--teal)}.stripe i:nth-child(3){background:var(--green)}.stripe i:nth-child(4){background:var(--orange)}
.st-head{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;background:var(--t);border-left:8px solid var(--c);padding:14px 16px}
.st-num{width:46px;height:46px;background:var(--ci);color:#FFFFFF;font-weight:700;font-size:24px;display:grid;place-items:center;flex:none}
.st-title{flex:1;min-width:220px}
.st-title h1{font-size:var(--t-xl);color:var(--ci);line-height:1.15;text-wrap:balance}
.st-title p{margin-top:3px}
.timer{display:flex;gap:8px;align-items:center}
.timer .t{font-variant-numeric:tabular-nums;font-size:24px;font-weight:700;min-width:70px;text-align:right}
.timer.done .t{color:var(--red-ink)}

.btn{font-size:var(--t-s);border:1.5px solid var(--navy);background:var(--bg);color:var(--navy);padding:7px 12px;border-radius:6px;cursor:pointer;font-weight:700}
.btn.solid{background:var(--navy);color:#FFFFFF}
.btn.quiet{border-color:var(--line);color:var(--ink);font-weight:400}
.label{font-size:var(--t-xs);font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.hint{color:var(--muted);font-size:var(--t-s)}
.row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px;min-width:0}
.g2,.g3,.g4{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr}}
@media (max-width:720px){.g2,.g4{grid-template-columns:1fr}}

.box{border:1.5px solid var(--c);background:var(--bg);display:flex;flex-direction:column;min-width:0}
.box-head{background:var(--ci);border-top:5px solid var(--c);padding:10px 14px 12px;color:#FFFFFF}
.box-label{font-size:var(--t-xs);font-weight:700;letter-spacing:.09em;text-transform:uppercase}
.box-prompt{margin-top:2px;font-weight:700}
.box-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px;flex:1}
.band{background:var(--navy);color:#FFFFFF;padding:12px 16px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
.band b{font-size:var(--t-l)}
.band span{color:#DCE6F7}

.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.note{position:relative;background:var(--n,var(--note));border:1px solid var(--nl,var(--note-line));border-radius:3px;display:flex;min-width:0}
.note textarea{flex:1;width:100%;border:0;background:transparent;resize:none;font-size:14.5px;line-height:1.35;color:var(--ink);padding:10px 26px 10px 10px;min-height:84px;overflow:hidden}
.note textarea::placeholder{color:var(--ci,var(--note-ink));opacity:.8}
.note .x{position:absolute;top:2px;right:2px;width:24px;height:24px;border:0;background:transparent;color:var(--ci,var(--note-ink));cursor:pointer;font-size:17px;line-height:1;border-radius:4px}
.add{align-self:flex-start;font-size:13.5px;border:1px dashed var(--muted);background:var(--bg);color:var(--muted);padding:5px 10px;border-radius:6px;cursor:pointer}
.field{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1}
.field input,.field textarea,.code{width:100%;font-size:var(--t-m);border:1.5px solid var(--c,var(--navy));border-radius:6px;padding:9px 11px;color:var(--ink);background:var(--bg)}
.field textarea,.code{resize:vertical;min-height:64px;line-height:1.4}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;word-break:break-all;border-color:var(--line)}

.tray{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;border:1.5px dashed var(--line);padding:12px;min-height:70px}
.card{background:var(--note);border:1px solid var(--note-line);border-radius:4px;padding:10px 12px;font-weight:700;font-size:14.5px;cursor:pointer;text-align:left;color:var(--ink)}
.card[aria-pressed="true"]{outline:3px solid var(--navy);outline-offset:1px}
.layer .box-body{min-height:170px;cursor:pointer}
.layer.over{background:var(--t)}
.layer-h{display:flex;gap:12px;align-items:center}
.layer-n{font-size:34px;font-weight:700;line-height:1}
.layer-name{font-size:var(--t-l);font-weight:700;line-height:1.2}

.pick{border:1.5px solid var(--line);background:var(--bg);padding:10px 12px;display:flex;gap:12px;align-items:center;cursor:pointer;text-align:left;font-size:var(--t-m);color:var(--ink);min-width:0}
.pick[aria-pressed="true"]{border-color:var(--green-ink);background:var(--green-tint)}
.pick .L{font-size:28px;font-weight:700;color:var(--green-ink);width:26px;flex:none}
.pick .nm{font-weight:700}
.pick .meta{color:var(--muted);font-size:13px}
.facts{background:var(--t);border-left:6px solid var(--c);padding:12px 16px 14px;display:flex;flex-direction:column;gap:6px}
.facts .box-label{color:var(--ci)}
.facts ul{padding-left:18px;display:flex;flex-direction:column;gap:3px;max-width:95ch}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{font-size:var(--t-s);font-weight:700;border:1.5px solid var(--ci);color:var(--ci);background:var(--bg);padding:7px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ci);color:#FFFFFF}

.go{border:1.5px solid var(--c);background:var(--bg);padding:0;cursor:pointer;text-align:left;color:var(--ink);display:flex;flex-direction:column;min-width:0;font-size:var(--t-m)}
.go-head{background:var(--ci);color:#FFFFFF;padding:10px 14px;display:flex;gap:10px;align-items:center;font-weight:700;font-size:var(--t-l)}
.go-head b{width:30px;height:30px;border-radius:50%;background:#FFFFFF;color:var(--ci);display:grid;place-items:center;font-size:16px;flex:none}
.go-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px}
.go .s{color:var(--muted);font-size:var(--t-s)}
.go .s.on{color:var(--green-ink);font-weight:700}
.rule{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:var(--t,var(--wash))}
.rule>b{width:34px;height:34px;border-radius:50%;background:var(--ci,var(--navy));color:#FFFFFF;display:grid;place-items:center;font-size:17px;flex:none}
.rule .box-label{color:var(--ci)}
.flow ul{padding-left:18px}
.flow li{margin:2px 0}
.lead{font-size:var(--t-l);max-width:62ch}

.tools{border:1px solid var(--line)}
.tools summary{cursor:pointer;padding:12px 14px;font-weight:700;color:var(--navy)}
.tools-body{padding:4px 14px 16px;display:flex;flex-direction:column;gap:16px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:var(--t-s)}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:middle}
th{background:var(--navy-tint);font-size:var(--t-xs);letter-spacing:.06em;text-transform:uppercase;color:var(--navy)}
th[class^="lens-"]{border-top:4px solid var(--c);color:var(--ci)}
tr.me td{background:var(--navy-tint)}
td .s{color:var(--muted)}
td .s.on{color:var(--green-ink);font-weight:700}
.msg{font-size:var(--t-s);color:var(--green-ink);font-weight:700}
.msg.bad{color:var(--red-ink)}

.case{border:1.5px solid var(--navy);background:var(--navy-tint);padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.case h2{font-size:22px;color:var(--navy);line-height:1.2;text-wrap:balance}
.links{display:flex;flex-direction:column;gap:10px;padding:0;list-style:none}
.links a{color:var(--navy);font-weight:700}
.links span{display:block;color:var(--muted);font-size:var(--t-s)}
dl{margin:0;display:grid;grid-template-columns:minmax(120px,200px) 1fr;gap:8px 16px}
dt{font-weight:700;color:var(--navy)}
dd{margin:0}
@media (max-width:560px){dl{grid-template-columns:1fr}dd{margin-bottom:6px}}
@media (prefers-reduced-motion:no-preference){.tab,.btn,.pick,.card,.go{transition:background-color .12s,border-color .12s}}
</style>
